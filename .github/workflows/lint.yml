name: flake8 Lint
on: [push]

jobs:
  flake8-lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Flake8
        run: python -m pip install flake8==7.5.0
      - name: Run Flake8
        run: python -m flake8 .
